<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Poll Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f1f5f9;
      color: #0f172a;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 { 
      margin: 0 0 0.25rem; 
    }

    p.sub { 
      margin: 0 0 1rem; 
      color: #475569; 
    }

    .tab-group {
      margin-bottom: 1rem;
    }

    .tab-group-title {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #334155;
      font-weight: 700;
    }

    /* Tab styles */
    .tabs-container {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-button {
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #64748b;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.3s ease;
      white-space: nowrap;
      font-weight: 500;
    }

    .tab-button:hover {
      color: #0f172a;
      background: #f8fafc;
    }

    .tab-button.active {
      color: #1d4ed8;
      border-bottom-color: #1d4ed8;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 1.08rem;
      margin: 0 0 .65rem;
    }

    .stat {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0.25rem 0 0.7rem;
      color: #1d4ed8;
    }

    .kv {
      margin: .25rem 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 0.2rem;
      font-size: .95rem;
    }

    .kv span:last-child { 
      font-weight: 600; 
    }

    .empty {
      color: #64748b;
      font-style: italic;
    }

    .answer-row {
      padding: .45rem .55rem;
      margin-bottom: .35rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: .95rem;
    }

    .error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: .6rem .75rem;
      margin-bottom: 1rem;
      display: none;
    }

    .loading {
      color: #64748b;
      font-style: italic;
      padding: 2rem;
      text-align: center;
    }

    .no-tabs {
      color: #64748b;
      font-style: italic;
      padding: 1rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .debug {
      background: #f0f0f0;
      border: 1px solid #ccc;
      padding: 0.5rem;
      margin-top: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Course Poll Dashboard</h1>
    <p class="sub">Live poll results from your async class.</p>
    <div id="error" class="error"></div>
    
    <!-- Tab groups container -->
    <div id="tabs-groups-root"></div>

    <!-- Tab contents -->
    <div id="tabs-content"></div>
  </div>

  <script type="module">
    import { db } from "../js/firebase-init.js";
    import {
      collection,
      getDocs,
      doc,
      getDoc,
      onSnapshot,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const tabsGroupsRoot = document.getElementById('tabs-groups-root');
    const tabsContent = document.getElementById('tabs-content');
    const errorBox = document.getElementById('error');
    
    let currentActiveTab = null;
    const tabMap = new Map(); // widgetId -> tab element
    const contentMap = new Map(); // widgetId -> content element
    const groupContainerMap = new Map(); // group key -> tabs container element

    const JPST_280_NEW_STUDENT_POLL_WIDGET = {
      widgetId: 'jpst-280-new-student-poll',
      title: 'New Student Poll',
      type: 'poll',
      active: true,
      classGroup: 'jpst-280'
    };

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    function addKV(container, label, value) {
      const row = document.createElement('div');
      row.className = 'kv';
      const left = document.createElement('span');
      left.textContent = label;
      const right = document.createElement('span');
      right.textContent = value;
      row.append(left, right);
      container.appendChild(row);
    }

    function sectionTitle(text) {
      const el = document.createElement('h3');
      el.style.margin = '0.85rem 0 0.35rem';
      el.style.fontSize = '0.98rem';
      el.textContent = text;
      return el;
    }

    function pickMap(agg, prefix) {
      const direct = agg?.[prefix];
      const result =
        (direct && typeof direct === 'object' && !Array.isArray(direct))
          ? { ...direct }
          : {};

      for (const [k, v] of Object.entries(agg || {})) {
        if (!k.startsWith(prefix + '.')) continue;
        const subKey = k.slice(prefix.length + 1);
        result[subKey] = v;
      }
      return result;
    }

    /**
     * Get all aggregate field names from the agg object (excluding system fields and Labels)
     */
    function getAggregateFields(agg) {
      const fields = new Set();
      for (const key of Object.keys(agg || {})) {
        // Skip system fields and label fields
        if (key === 'widgetId' || key === 'courseId' || key === 'term' || 
            key === 'totalResponses' || key === 'createdAt' || key === 'updatedAt' ||
            key.endsWith('Labels')) {
          continue;
        }
        // This is a top-level aggregate field (contains nested counts)
        if (typeof agg[key] === 'object' && !Array.isArray(agg[key])) {
          fields.add(key);
        }
      }
      return Array.from(fields);
    }

    function formatFieldName(fieldName) {
      // Convert camelCase to Title Case with spaces
      return fieldName
        .replace(/([A-Z])/g, ' $1')     // camelCase to spaces
        .replace(/^./, str => str.toUpperCase()) // capitalize first
        .replace(/_/g, ' ')              // underscores to spaces
        .trim();
    }

    function renderPollCard(widgetMeta, agg) {
      const card = document.createElement('article');
      card.className = 'card';
      const title = document.createElement('h2');
      title.textContent = widgetMeta.title || widgetMeta.widgetId;

      const total = document.createElement('p');
      total.className = 'stat';
      total.textContent = String(agg?.totalResponses ?? 0);

      card.append(title);
      const totalLbl = document.createElement('div');
      totalLbl.textContent = 'Total responses';
      totalLbl.style.fontSize = '.9rem';
      totalLbl.style.color = '#475569';
      card.append(totalLbl, total);

      // Debug: log aggregate data structure
      console.log(`Aggregate data for ${widgetMeta.widgetId}:`, agg);

      // Get all aggregate fields dynamically
      const fields = getAggregateFields(agg);
      console.log(`Fields found: ${fields.join(', ')}`);

      if (fields.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No response data yet.';
        card.append(empty);
      } else {
        // Render each field as a section
        fields.forEach((fieldName) => {
          const fieldData = pickMap(agg, fieldName);
          const labelMap = pickMap(agg, fieldName + 'Labels');

          console.log(`Field: ${fieldName}`, { fieldData, labelMap });

          const formattedFieldName = formatFieldName(fieldName);
          card.append(sectionTitle(formattedFieldName));

          if (Object.keys(fieldData).length === 0) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = 'No data yet.';
            card.append(empty);
          } else {
            Object.entries(fieldData)
              .sort((a, b) => b[1] - a[1])
              .forEach(([k, v]) => {
                // Use label if available, otherwise format the key
                const label = labelMap[k] || formatFieldName(k);
                addKV(card, label, v);
              });
          }
        });
      }

      return card;
    }

    function createTabButton(widgetMeta) {
      const button = document.createElement('button');
      button.className = 'tab-button';
      button.dataset.widgetId = widgetMeta.widgetId;
      
      const title = widgetMeta.title || widgetMeta.widgetId;
      button.textContent = title;
      
      button.addEventListener('click', () => switchTab(widgetMeta.widgetId));
      
      return button;
    }

    function createTabContent(widgetMeta, widgetId) {
      const div = document.createElement('div');
      div.className = 'tab-content';
      div.dataset.widgetId = widgetId;
      
      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid';
      
      const loadingMsg = document.createElement('p');
      loadingMsg.className = 'loading';
      loadingMsg.textContent = 'Loading poll data...';
      gridDiv.appendChild(loadingMsg);
      
      div.appendChild(gridDiv);
      
      return div;
    }

    function normalizeClassGroup(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getGroupKey(widgetMeta) {
      const normalizedId = normalizeClassGroup(widgetMeta.widgetId);
      const normalizedTitle = normalizeClassGroup(widgetMeta.title);
      const classGroup = normalizeClassGroup(widgetMeta.classGroup);
      const course = normalizeClassGroup(widgetMeta.course);

      if (
        classGroup === 'jpst-280' ||
        course === 'jpst-280' ||
        normalizedId.includes('jpst-280') ||
        normalizedTitle.includes('jpst 280')
      ) {
        return 'jpst-280';
      }

      return 'japan-110';
    }

    function getGroupLabel(groupKey) {
      if (groupKey === 'jpst-280') return 'JPST 280 Polls';
      return 'Japan 110 Responses';
    }

    function getOrCreateGroupTabsContainer(groupKey) {
      if (groupContainerMap.has(groupKey)) {
        return groupContainerMap.get(groupKey);
      }

      const section = document.createElement('section');
      section.className = 'tab-group';
      section.dataset.groupKey = groupKey;

      const heading = document.createElement('h2');
      heading.className = 'tab-group-title';
      heading.textContent = getGroupLabel(groupKey);

      const tabsContainer = document.createElement('div');
      tabsContainer.className = 'tabs-container';

      section.append(heading, tabsContainer);

      if (groupKey === 'japan-110') {
        tabsGroupsRoot.prepend(section);
      } else {
        tabsGroupsRoot.append(section);
      }

      groupContainerMap.set(groupKey, tabsContainer);
      return tabsContainer;
    }

    async function loadAndRenderTab(widgetId) {
      const contentEl = contentMap.get(widgetId);
      if (!contentEl) return;
      
      const gridDiv = contentEl.querySelector('.grid');
      
      try {
        // Get widget metadata
        const local = await fetch('../widgets.json').then(r => r.json()).catch(() => []);
        const allWidgets = local.length > 0 ? local : (await getDocs(collection(db, 'widgets'))).docs.map(d => d.data());
        const widgetMeta = allWidgets.find(w => w.widgetId === widgetId) || (widgetId === JPST_280_NEW_STUDENT_POLL_WIDGET.widgetId ? JPST_280_NEW_STUDENT_POLL_WIDGET : null);
        
        if (!widgetMeta) {
          gridDiv.innerHTML = '<p class="empty">Widget metadata not found.</p>';
          return;
        }

        // Get aggregate data
        const aggSnap = await getDoc(doc(db, 'aggregates', widgetId));
        const agg = aggSnap.exists() ? aggSnap.data() : {};

        // Clear and render
        gridDiv.innerHTML = '';
        
        if (widgetMeta.type === 'poll') {
          gridDiv.appendChild(renderPollCard(widgetMeta, agg));
        } else {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `<h2>${widgetMeta.title || widgetId}</h2><p class="empty">No renderer yet for widget type: ${widgetMeta.type}</p>`;
          gridDiv.appendChild(card);
        }

        // Set up real-time listener for aggregate updates
        const unsubscribe = onSnapshot(doc(db, 'aggregates', widgetId), (snap) => {
          if (snap.exists() && contentEl.classList.contains('active')) {
            const updatedAgg = snap.data();
            gridDiv.innerHTML = '';
            if (widgetMeta.type === 'poll') {
              gridDiv.appendChild(renderPollCard(widgetMeta, updatedAgg));
            }
          }
        });

        // Store unsubscribe for cleanup if needed
        contentEl.unsubscribe = unsubscribe;

      } catch (err) {
        console.error(`Error loading tab ${widgetId}:`, err);
        gridDiv.innerHTML = '<p class="empty">Error loading poll data. Check console.</p>';
      }
    }

    function switchTab(widgetId) {
      // Deactivate old tab
      if (currentActiveTab) {
        const oldBtn = tabMap.get(currentActiveTab);
        const oldContent = contentMap.get(currentActiveTab);
        if (oldBtn) oldBtn.classList.remove('active');
        if (oldContent) oldContent.classList.remove('active');
      }

      // Activate new tab
      const newBtn = tabMap.get(widgetId);
      const newContent = contentMap.get(widgetId);
      if (newBtn) newBtn.classList.add('active');
      if (newContent) newContent.classList.add('active');

      currentActiveTab = widgetId;

      // Load data for this tab
      loadAndRenderTab(widgetId);
    }

    async function addTab(widgetMeta) {
      const widgetId = widgetMeta.widgetId;

      // Skip if already exists
      if (tabMap.has(widgetId)) return;

      const groupKey = getGroupKey(widgetMeta);
      const groupTabsContainer = getOrCreateGroupTabsContainer(groupKey);

      // Create tab button
      const tabBtn = createTabButton(widgetMeta);
      groupTabsContainer.appendChild(tabBtn);
      tabMap.set(widgetId, tabBtn);

      // Create tab content
      const tabContent = createTabContent(widgetMeta, widgetId);
      tabsContent.appendChild(tabContent);
      contentMap.set(widgetId, tabContent);

      // If this is the first tab, activate it
      if (!currentActiveTab) {
        switchTab(widgetId);
      }
    }

    async function loadWidgets() {
      const local = await fetch('../widgets.json').then(r => r.json()).catch(() => []);

      if (local.length > 0) {
        const activeLocal = local.filter(w => w.active !== false);
        if (!activeLocal.some(w => w.widgetId === JPST_280_NEW_STUDENT_POLL_WIDGET.widgetId)) {
          activeLocal.push(JPST_280_NEW_STUDENT_POLL_WIDGET);
        }
        return activeLocal;
      }

      const snap = await getDocs(collection(db, 'widgets'));
      const widgets = snap.docs.map(d => d.data()).filter(w => w.active !== false);
      if (!widgets.some(w => w.widgetId === JPST_280_NEW_STUDENT_POLL_WIDGET.widgetId)) {
        widgets.push(JPST_280_NEW_STUDENT_POLL_WIDGET);
      }
      return widgets;
    }

    async function main() {
      try {
        hideError();
        const widgets = await loadWidgets();

        if (!widgets.length) {
          tabsContent.innerHTML = '<div class="no-tabs"><p class="empty">No active polls found. Check back soon!</p></div>';
          return;
        }

        // Add all existing widgets as tabs
        for (const w of widgets) {
          await addTab(w);
        }

        // Set up real-time listener for new widgets
        const q = query(collection(db, 'widgets'), where('active', '!=', false));
        const unsubscribe = onSnapshot(q, (snap) => {
          snap.docChanges().forEach((change) => {
            if (change.type === 'added' || change.type === 'modified') {
              const widget = change.doc.data();
              addTab(widget).catch(console.error);
            }
          });
        });

      } catch (err) {
        console.error('Error in dashboard:', err);
        showError('Could not load dashboard. Check Firebase config and Firestore rules.');
      }
    }

    main();
  </script>
</body>
</html>
