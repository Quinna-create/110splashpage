<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Announcement Widget</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --meta: #64748b;
      --border: #dbe2f0;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --focus: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .widget {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.3;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 1rem;
    }

    .cta {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 700;
      line-height: 1.2;
    }

    .cta:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .meta {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--meta);
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .widget {
        padding: 16px;
      }

      h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <article class="widget" aria-label="110 weekly update widget">
    <h1>Welcome to 110</h1>
    <p>Check this space each week for concise updates, highlights, and important links.</p>
    <a class="cta" href="https://github.com/Quinna-create/110splashpage" target="_blank" rel="noopener noreferrer">Open the 110 Project Page</a>
    <div class="meta">Updated: 2026-08-22 00:00 UTC</div>
  </article>
</body>
</html>
