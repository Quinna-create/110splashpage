<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Announcement Widget (Compact)</title>
  <style>
    :root {
      color-scheme: light;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --meta: #64748b;
      --border: #dbe2f0;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --focus: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .widget {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      padding: 10px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
    }

    p {
      margin: 6px 0 0;
      font-size: 0.88rem;
      line-height: 1.3;
      color: var(--muted);
    }

    .row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cta {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .cta:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .meta {
      margin: 0;
      font-size: 0.75rem;
      color: var(--meta);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <article class="widget" aria-label="110 weekly update widget compact">
    <h1>Welcome to 110</h1>
    <p>Weekly updates and quick links in one place.</p>
    <div class="row">
      <a class="cta" href="https://github.com/Quinna-create/110splashpage" target="_blank" rel="noopener noreferrer">Open Project</a>
      <div class="meta">Updated: 2026-08-22 00:00 UTC</div>
    </div>
  </article>
</body>
</html>
