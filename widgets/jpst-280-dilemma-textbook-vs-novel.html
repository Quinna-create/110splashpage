<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget: JPST 280 Textbook vs Novel</title>
  <style>
    :root {
      --bg1: #0f1023;
      --bg2: #19163a;
      --ink: #f8f6ff;
      --muted: #d6cff7;
      --card: rgba(20, 17, 45, 0.84);
      --stroke: rgba(173, 147, 255, 0.42);
      --accent1: #ff4fa3;
      --accent2: #8b5cf6;
      --accent3: #22d3ee;
      --ok: #86efac;
      --err: #fecaca;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 79, 163, .28), transparent 34%),
        radial-gradient(circle at 84% 14%, rgba(34, 211, 238, .23), transparent 34%),
        radial-gradient(circle at 72% 86%, rgba(139, 92, 246, .25), transparent 36%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      background-position: center 10%;
      background-repeat: no-repeat;
      background-size: 100% 55%;
      padding: 3rem 1rem 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: auto;
      max-height: fit-content;
      overflow: hidden;
    }

    .card {
      max-width: 940px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 1.3rem;
      box-shadow:
        0 16px 44px rgba(12, 9, 30, .55),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 1.42rem;
      margin: 0 0 .4rem;
      line-height: 1.2;
      letter-spacing: .01em;
    }

    p.note {
      margin: 0 0 1rem;
      font-size: .95rem;
      color: var(--muted);
    }

    .poll-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    .question-block {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      padding: 1rem;
      display: grid;
      grid-template-rows: 1fr;
      align-items: stretch;
    }

    .question-title {
      font-weight: 700;
      font-size: 1.03rem;
      margin: 0;
      line-height: 1.52;
      color: #fdf7ff;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      display: flex;
      align-items: flex-start;
    }

    .answers-block {
      display: flex;
      flex-direction: column;
      gap: .68rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      padding: 1rem;
    }

    .option {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .72rem .8rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.07);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      cursor: pointer;
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: #b9a3ff;
      box-shadow: 0 8px 18px rgba(139,92,246,.24);
    }

    .option input[type="radio"] {
      accent-color: #ff4fa3;
      transform: scale(1.12);
      flex-shrink: 0;
    }

    .option span {
      font-size: 1rem;
      font-weight: 600;
      text-transform: lowercase;
      letter-spacing: .01em;
    }

    button {
      margin-top: .98rem;
      width: 100%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: .8rem .95rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(93, 74, 187, .38);
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(93, 74, 187, .44);
      filter: saturate(1.08);
    }

    button:active { transform: translateY(0); }

    .msg {
      margin-top: .72rem;
      font-size: .95rem;
      min-height: 1.2em;
    }

    .ok { color: var(--ok); }
    .err { color: var(--err); }

    @media (max-width: 760px) {
      .poll-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body { padding: 2rem .75rem 0.5rem .75rem; }
      .card { border-radius: 16px; padding: 1rem; }
      h1 { font-size: 1.22rem; }
      .question-title { font-size: .98rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>JPST 280: Textbook vs Novel</h1>
    <p class="note">This one is anonymous, so be honest.</p>

    <form id="textbookVsNovelPoll">
      <div class="poll-layout">
        <section class="question-block" aria-labelledby="questionHeading">
          <p id="questionHeading" class="question-title">
            Is a textbook or a novel a more effective method to learn about the past?
          </p>
        </section>

        <section class="answers-block" aria-label="Answer choices">
          <label class="option" for="answerTextbook">
            <input id="answerTextbook" type="radio" name="dilemmaChoice" value="textbook" data-label="Textbook" required />
            <span>textbook</span>
          </label>

          <label class="option" for="answerNovel">
            <input id="answerNovel" type="radio" name="dilemmaChoice" value="novel" data-label="Novel" required />
            <span>novel</span>
          </label>

          <button type="submit">Submit</button>
          <div id="message" class="msg" aria-live="polite"></div>
        </section>
      </div>
    </form>
  </div>

  <script type="module">
    import { ensureWidgetRegistry, submitPollResponse } from "../js/widget-utils.js";

    const WIDGET_ID = "jpst-280-dilemma-textbook-vs-novel";

    await ensureWidgetRegistry({
      widgetId: WIDGET_ID,
      title: "JPST 280: Textbook vs Novel",
      type: "poll",
      version: 1,
      active: true,
      classGroup: "jpst-280"
    });

    const form = document.getElementById('textbookVsNovelPoll');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';

      const selectedInput = form.querySelector('input[name="dilemmaChoice"]:checked');
      if (!selectedInput) {
        msg.textContent = 'Please select one answer.';
        msg.classList.add('err');
        return;
      }

      const value = selectedInput.value;
      const label = selectedInput.dataset.label || value;

      try {
        await submitPollResponse({
          widgetId: WIDGET_ID,
          answers: {
            dilemmaChoice: {
              value,
              label
            }
          }
        });

        form.reset();
        msg.textContent = 'Thank you! Your anonymous response was submitted.';
        msg.classList.add('ok');
      } catch (error) {
        console.error(error);
        msg.textContent = 'Submission failed. Please try again in a moment.';
        msg.classList.add('err');
      }
    });
  </script>
</body>
</html>
